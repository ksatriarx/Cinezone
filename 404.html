<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Halaman Tidak Ditemukan — CineZone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23a70836'/><polygon points='35,25 75,50 35,75' fill='white'/></svg>">
<style>
:root{--bg:#0d0d12;--bg-alt:#14141c;--card:#1a1a24;--accent:#a70836;--accent-2:#e01050;--text:#f2f2f7;--text-dim:#9a9aad;--border:#26263a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
.container{max-width:1280px;margin:0 auto;padding:0 16px}
.main-header{background:rgba(13,13,18,.94);border-bottom:1px solid var(--border)}
.navbar{display:flex;align-items:center;height:64px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;color:#fff}
.nav-brand .logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
.nav-brand .logo-mark svg{width:18px;height:18px}
.nav-brand span b{color:var(--accent-2)}
.error-page{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px;text-align:center;position:relative;overflow:hidden}
.error-page::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(224,16,80,.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0}
.error-content{position:relative;z-index:1;max-width:560px}
.error-code{font-size:clamp(5rem,20vw,9rem);font-weight:900;line-height:1;letter-spacing:-4px;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;text-shadow:0 0 60px rgba(224,16,80,.3)}
.error-emoji{font-size:3.5rem;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.error-title{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;margin-bottom:12px;color:#fff;letter-spacing:-.3px}
.error-desc{font-size:.95rem;line-height:1.7;color:var(--text-dim);margin-bottom:32px;max-width:440px;margin-left:auto;margin-right:auto}
.error-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn-home{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:var(--accent);color:#fff;border-radius:9px;font-size:.9rem;font-weight:700;transition:.2s;min-height:48px}
.btn-home:hover{background:var(--accent-2);transform:translateY(-2px)}
.btn-back{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;border-radius:9px;font-size:.88rem;font-weight:700;transition:.2s;min-height:48px}
.btn-back:hover{background:rgba(255,255,255,.15)}
.suggested{margin-top:48px;padding-top:32px;border-top:1px solid var(--border)}
.suggested h3{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:16px;font-weight:700}
.suggested-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggested-links a{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:.82rem;font-weight:600;color:var(--text-dim);transition:.2s}
.suggested-links a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<header class="main-header">
  <div class="container">
    <nav class="navbar">
      <a href="index.html" class="nav-brand">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="white"><polygon points="8,5 19,12 8,19"/></svg></span>
        <span>Cine<b>Zone</b></span>
      </a>
    </nav>
  </div>
</header>

<main class="error-page">
  <div class="error-content">
    <div class="error-emoji">🎬</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Halaman Tidak Ditemukan</h1>
    <p class="error-desc">Film atau halaman yang kamu cari sepertinya sudah dihapus, dipindahkan, atau tidak pernah ada. Jangan sedih — masih banyak film keren menunggu.</p>
    <div class="error-actions">
      <a href="index.html" class="btn-home">🏠 Kembali ke Beranda</a>
      <button class="btn-back" onclick="history.back()">← Halaman Sebelumnya</button>
    </div>
    <div class="suggested">
      <h3>Populer Minggu Ini</h3>
      <div class="suggested-links">
        <a href="movie.html?id=spider-man-no-way-home">Spider-Man: No Way Home</a>
        <a href="movie.html?id=oppenheimer">Oppenheimer</a>
        <a href="movie.html?id=the-batman">The Batman</a>
        <a href="movie.html?id=dune-part-two">Dune 2</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
